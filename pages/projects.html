<!DOCTYPE html>
<html lang="en">
  <head> 
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="title" content="Abdellah Nait Hadid | Full-Stack Engineer & Tech Innovator | Scalable Systems & APIs">
      <meta name="description" content="Full-stack Engineer specializing in backend systems, scalable APIs, and modern web apps. Experienced in NestJS, Node.js, React, Docker, and cloud solutions. Open to job opportunities, collaborations, and freelance projects. Let’s build something great!">
      <link rel="icon" type="image/svg+xml" href="../imgs/HA.svg">
      <title>Projects Portfolio</title>
      <style>
          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }

          body {
            --gradient: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(10, 10, 10, 0.7));
            background: var(--gradient);
            color: #ccd6f6;
            min-height: 100vh;
            padding: 2rem;
          }

          .container {
              max-width: 1200px;
              margin: 0 auto;
              overflow-x: auto;
          }

          .back-link {
              color: #64ffda;
              text-decoration: none;
              display: inline-flex;
              align-items: center;
              font-family: "Inconsolata", monospace;
              gap: 0.5rem;
              margin-bottom: 1rem;
          }

          .back-link:hover {
              text-decoration: underline;
          }

          h1 {
              font-size: 3rem;
              color: #e6f1ff;
              font-family: 'Poppins', sans-serif;
              margin-bottom: 3rem;
          }

          .projects-table {
              width: 100%;
              border-collapse: collapse;
          }

          .projects-table th {
              text-align: left;
              padding: 1rem 0;
              color: #8892b0;
              font-weight: normal;
              font-family: 'Inconsolata', monospace;
              border-bottom: 1px solid #fff;
          }

          .projects-table td, th {
              padding: 2rem 0;
              border-bottom: 1px solid #000;
          }

          .year {
              color: #8892b0;
              font-family: 'Poppins', sans-serif;
              width: 100px;
          }

          .project-name {
              font-weight: 500;
              font-family: 'Poppins', sans-serif;
              color: #e6f1ff;
          }

          .made-at {
              color: #8892b0;
              font-family: 'Poppins', sans-serif;
          }

          .tech-stack {
              display: flex;
              gap: 0.5rem;
              flex-wrap: wrap;
              font-family: 'Inconsolata', monospace;
          }

          .tech-tag {
              background-color: rgba(100, 255, 218, 0.1);
              color: #64ffda;
              padding: 0.25rem 0.75rem;
              border-radius: 50px;
              font-size: 0.875rem;
          }

          .external-link {
              color: #8892b0;
              font-family: 'Poppins', sans-serif;
              text-decoration: none;
              display: inline-flex;
              align-items: center;
          }

          .external-link:hover {
              color: #64ffda;
          }

          @media (max-width: 768px) {
              .projects-table, .projects-table tbody, .projects-table tr {
                  display: block;
              }
              
              .projects-table th {
                  display: none;
              }

              .projects-table td {
                  display: block;
                  padding: 0.5rem 0;
              }

              .projects-table tr {
                  padding: 2rem 0;
                  border-bottom: 1px solid #233554;
              }
          }
      </style>
  </head>
  <body>
      <div class="container">
          <a href="../index.html" class="back-link">← Abdellah Hadid</a>
          <h1>All Projects</h1>
          
          <table class="projects-table">
              <thead>
                  <tr>
                      <th>Year</th>
                      <th>Project</th>
                      <th>Made at</th>
                      <th>Built with</th>
                      <th>Link</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td class="year">2024</td>
                      <td class="project-name">SonnarSage</td>
                      <td class="made-at"></td>
                      <td>
                          <div class="tech-stack">
                              <span class="tech-tag">Figma</span>
                              <span class="tech-tag">Wireframe</span>
                          </div>
                      </td>
                      <td>
                          <a href="showcase.html" class="external-link">
                              See project details ↗
                          </a>
                      </td>
                  </tr>
                  <tr>
                      <td class="year">2024</td>
                      <td class="project-name">SonnarSage</td>
                      <td class="made-at"></td>
                      <td>
                          <div class="tech-stack">
                              <span class="tech-tag">Figma</span>
                              <span class="tech-tag">Wireframe</span>
                          </div>
                      </td>
                      <td>
                          <a href="showcase.html" class="external-link">
                              See project details ↗
                          </a>
                      </td>
                  </tr>
              </tbody>
          </table>
      </div>
  </body>
</html>
